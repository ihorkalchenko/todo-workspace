<div class="flex items-center justify-between mb-8 gap-4">
  <app-task-search class="flex-1" />

  <a
    [routerLink]="['/tasks', 'new']"
    class="bg-indigo-600 hover:bg-indigo-700 cursor-pointer text-white font-medium py-2 px-4 rounded-sm transition duration-200"
  >
    + Add task
  </a>
</div>

@if (!taskFilterService.hasAnyTasks()) {
  <div class="rounded-sm border border-gray-200 bg-indigo-50 text-gray-700 px-6 py-4 text-center">
    No tasks found. Create a new task to begin tracking your work.
  </div>
} @else if (taskFilterService.allTasks().length === 0) {
  <div role="status" class="rounded-sm border border-gray-200 bg-gray-50 text-gray-700 px-6 py-4 text-center">
    <p>No tasks match your filters.</p>
    <button
      type="button"
      (click)="taskFilterService.clearFilters()"
      class="mt-2 text-sm font-medium text-indigo-600 hover:text-indigo-800 cursor-pointer"
    >
      Clear filters
    </button>
  </div>
} @else {
  @if (taskFilterService.showArchived()) {
    <div class="max-w-md">
      <app-task-list
        title="Archived Tasks"
        [tasks]="taskFilterService.archivedTasks()"
        (dropped)="drop($event, 'Archived')"
      />
    </div>
  } @else {
    <div
      cdkDropListGroup
      class="grid grid-cols-1 md:grid-cols-3 gap-4 items-start md:items-stretch"
    >
      <app-task-list
        title="To Do"
        [tasks]="taskFilterService.todoTasks()"
        (dropped)="drop($event, 'To Do')"
      />

      <app-task-list
        title="Doing"
        [tasks]="taskFilterService.doingTasks()"
        (dropped)="drop($event, 'Doing')"
      />

      <app-task-list
        title="Done"
        [tasks]="taskFilterService.doneTasks()"
        (dropped)="drop($event, 'Done')"
      />
    </div>
  }
}
